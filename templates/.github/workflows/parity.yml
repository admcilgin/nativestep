# The behavior contract on every PR: the same tests on iOS and Android (COMPONENTS.md §6).
name: parity
on:
  pull_request:

jobs:
  parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The latest nativestep release (NATIVESTEP_REPO overrides the repo). macos-latest runs on arm64.
      - name: nativestep CLI
        run: |
          mkdir -p "$RUNNER_TEMP/nativestep"
          curl -fsSL "https://github.com/${{ vars.NATIVESTEP_REPO || 'admcilgin/nativestep' }}/releases/latest/download/nativestep-darwin-arm64.tar.gz" | tar -xz -C "$RUNNER_TEMP/nativestep"
          echo "$RUNNER_TEMP/nativestep/nativestep-darwin-arm64/bin" >> "$GITHUB_PATH"
      - name: Architecture rules
        run: nativestep lint
      - name: Behavior tests
        run: nativestep test --target ios,android
