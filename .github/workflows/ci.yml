# Opens a project from the templates, builds both apps and runs the conformance tests (PLAN.md M3).
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  template:
    runs-on: macos-latest
    env:
      DEMO: ${{ github.workspace }}/../demo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: brew install xcodegen

      - name: Test SDK unit tests
        working-directory: kits/test-sdk
        run: bun test

      - name: CLI tests (lint rules, scan, status)
        working-directory: cli
        run: bun test

      - name: nativestep init
        run: bun cli/src/main.ts init "$DEMO" --app Demo --ios-bundle-id com.demo.app --android-package com.demo.app

      - name: Lint the new project
        run: cd "$DEMO" && bun "$GITHUB_WORKSPACE/cli/src/main.ts" lint

      - name: Conformance tests, headless
        run: cd "$DEMO" && bun "$GITHUB_WORKSPACE/cli/src/main.ts" test _sample --target ios,android

      - name: Build the iOS app
        run: >-
          cd "$DEMO/ios" && xcodegen generate --quiet &&
          xcodebuild -project Demo.xcodeproj -scheme Demo -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet build

      - name: Build the Android app
        run: cd "$DEMO" && android/gradlew -p android -q :app:assembleDebug
