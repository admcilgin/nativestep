# A v* tag builds the nativestep archives for macOS and Linux and attaches them to a GitHub release (PLAN.md M8).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The tag names the release; nativestep --version prints cli/package.json's version. They must agree.
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version cli/package.json)" || { echo "tag $GITHUB_REF_NAME does not match cli/package.json $(jq -r .version cli/package.json)"; exit 1; }
      - run: bun test
        working-directory: cli
      - run: bun cli/release.ts
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
